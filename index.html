<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindMitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: chat on the left, mood and tools panel on the right; stacks on phones.
   Color: deep teal brand, cool mint ground, one warm orange reserved for safety content.
   Type: Bricolage Grotesque for headings, Figtree for reading, Noto Sans Devanagari for Hindi. */
:root {
  --bg: #F1F7F6;
  --surface: #FFFFFF;
  --ink: #12343B;
  --muted: #546D72;
  --brand: #0F6E6A;
  --on-brand: #FFFFFF;
  --soft: #DDEDEB;
  --line: #CBDEDB;
  --warm: #B4570F;
  --warm-soft: #FBEBDD;
  --font-display: "Bricolage Grotesque", "Noto Sans Devanagari", system-ui, sans-serif;
  --font-body: "Figtree", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1B1F; --surface: #122A30; --ink: #E5F1EF; --muted: #93ABAF; --brand: #52BBB0;
    --on-brand: #0B1B1F; --soft: #1A3A40; --line: #25464D; --warm: #F3A760; --warm-soft: #3A2A1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1B1F; --surface: #122A30; --ink: #E5F1EF; --muted: #93ABAF; --brand: #52BBB0;
  --on-brand: #0B1B1F; --soft: #1A3A40; --line: #25464D; --warm: #F3A760; --warm-soft: #3A2A1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 20px 40px; }
.app { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.2; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 1.9rem; color: var(--brand); letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.help-btn { border: 1.5px solid var(--warm); background: var(--warm-soft); color: var(--warm); font-weight: 600; padding: 7px 14px; border-radius: 999px; font-size: 0.9rem; }
.help-panel { background: var(--warm-soft); border: 1.5px solid var(--warm); border-radius: 14px; padding: 16px 18px; }
.help-panel h2 { font-size: 1.1rem; color: var(--warm); margin-bottom: 6px; }
.help-panel p { margin: 4px 0; }
.num { font-weight: 700; font-variant-numeric: tabular-nums; user-select: all; }

/* grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }

/* chat */
.chat { display: flex; flex-direction: column; height: min(640px, 82vh); min-height: 460px; }
.chat-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.chat-head h2 { font-size: 1.05rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--brand); }
.log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; }
.msg.bot { background: var(--soft); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg.user { background: var(--brand); color: var(--on-brand); border-bottom-right-radius: 4px; align-self: flex-end; }
.msg.safety { background: var(--warm-soft); border: 1.5px solid var(--warm); max-width: 94%; }
.typing { display: inline-flex; gap: 4px; padding: 14px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: 0.5; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: 0.15s; } .typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 50% { opacity: 1; transform: translateY(-2px); } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 10px; }
.chip { border: 1.5px solid var(--brand); background: transparent; color: var(--brand); padding: 6px 13px; border-radius: 999px; font-weight: 600; font-size: 0.92rem; }
.chip:hover { background: var(--soft); }
.composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 11px 14px; font: inherit; }
.btn { border: 0; background: var(--brand); color: var(--on-brand); font-weight: 600; padding: 10px 18px; border-radius: 12px; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn:disabled { opacity: 0.5; cursor: default; }

/* side panel */
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 13px 8px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.pane { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.pane h3 { font-size: 1.05rem; }
.sub { color: var(--muted); font-size: 0.92rem; margin: 2px 0 0; }
.scores { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scores button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.scores button b { font-family: var(--font-display); font-size: 1.25rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.scores button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.scores button[aria-pressed="true"] b { color: var(--on-brand); }
.chart-wrap { border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px 4px; background: var(--bg); }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.tag { display: inline-block; font-size: 0.78rem; font-weight: 600; color: var(--warm); background: var(--warm-soft); padding: 2px 9px; border-radius: 999px; }
.insight { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin: 0; }

.tool-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tool-list button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; text-align: left; font-weight: 600; }
.tool-list button small { display: block; font-weight: 400; color: var(--muted); font-size: 0.82rem; }
.tool-list button[aria-pressed="true"] { border-color: var(--brand); background: var(--soft); }
.tool-body { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.orb-wrap { position: relative; display: grid; place-items: center; height: 210px; }
.orb { width: 190px; height: 190px; border-radius: 50%; background: var(--soft); border: 3px solid var(--brand); transform: scale(0.75); }
.orb-label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: var(--brand); pointer-events: none; }
.step-card { background: var(--soft); border-radius: 14px; padding: 16px; text-align: center; }
.step-card .big { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; color: var(--brand); line-height: 1; }
textarea { width: 100%; min-height: 76px; resize: vertical; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; }
label.f { display: flex; flex-direction: column; gap: 5px; font-weight: 600; font-size: 0.92rem; }
.entries { display: flex; flex-direction: column; gap: 8px; }
.entry { border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 0.92rem; overflow-wrap: anywhere; }
.entry time { display: block; color: var(--muted); font-size: 0.78rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.foot { color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } .orb { transition: none !important; } }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>MindMitra</h1>
      <p data-i="tagline"></p>
    </div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" type="button" aria-pressed="true">English</button>
        <button id="lang-hi" type="button" aria-pressed="false" lang="hi">हिंदी</button>
      </div>
      <button id="help-btn" class="help-btn" type="button" aria-expanded="false" aria-controls="help-panel" data-i="needHelp"></button>
    </div>
  </header>

  <section id="help-panel" class="help-panel" hidden>
    <h2 data-i="helpTitle"></h2>
    <p><span data-i="helpTele"></span> <span class="num">14416</span> / <span class="num">1800-891-4416</span></p>
    <p><span data-i="helpEmerg"></span> <span class="num">112</span></p>
    <p data-i="helpTrust"></p>
  </section>

  <main class="grid">
    <section class="panel chat" aria-label="Chat">
      <div class="chat-head"><span class="dot" aria-hidden="true"></span><h2 data-i="chatTitle"></h2></div>
      <div id="log" class="log" role="log" aria-live="polite"></div>
      <div id="chips" class="chips"></div>
      <form id="composer" class="composer" autocomplete="off">
        <input id="msg" type="text" maxlength="400" aria-label="Message">
        <button id="send" class="btn" type="submit" data-i="send"></button>
      </form>
    </section>

    <aside class="panel" id="side">
      <div class="tabs" role="tablist">
        <button id="tab-mood" role="tab" aria-selected="true" aria-controls="pane-mood" type="button" data-i="tabMood"></button>
        <button id="tab-tools" role="tab" aria-selected="false" aria-controls="pane-tools" type="button" data-i="tabTools"></button>
      </div>

      <div id="pane-mood" class="pane" role="tabpanel" aria-labelledby="tab-mood">
        <div>
          <h3 data-i="checkin"></h3>
          <p class="sub" data-i="checkinSub"></p>
        </div>
        <div id="scores" class="scores"></div>
        <div>
          <h3 data-i="trend"></h3>
          <p class="sub" id="trend-sub"></p>
        </div>
        <div class="chart-wrap"><svg id="chart" viewBox="0 0 330 180" role="img" aria-labelledby="chart-label"><title id="chart-label"></title></svg></div>
        <p id="insight" class="insight"></p>
        <div class="row">
          <button id="clear" class="btn ghost" type="button" data-i="clear"></button>
        </div>
      </div>

      <div id="pane-tools" class="pane" role="tabpanel" aria-labelledby="tab-tools" hidden>
        <div>
          <h3 data-i="toolsTitle"></h3>
          <p class="sub" data-i="toolsSub"></p>
        </div>
        <div class="tool-list" id="tool-list"></div>
        <div id="tool-body" class="tool-body"></div>
      </div>
    </aside>
  </main>

  <footer class="foot">
    <span data-i="disclaimer"></span>
    <span data-i="proto"></span>
  </footer>
</div>

  /* ---------- tabs ---------- */
  function showTab(name) {
    var mood = name === "mood";
    $("tab-mood").setAttribute("aria-selected", String(mood));
    $("tab-tools").setAttribute("aria-selected", String(!mood));
    $("pane-mood").hidden = !mood; $("pane-tools").hidden = mood;
  }
  $("tab-mood").addEventListener("click", function () { showTab("mood"); });
  $("tab-tools").addEventListener("click", function () { showTab("tools"); });

  /* ---------- tools ---------- */
  var curTool = "breathe", breathRun = 0, gStep = 0, promptIdx = 0;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function renderToolList() {
    var t = tx(), box = $("tool-list"); box.textContent = "";
    ["breathe", "ground", "reframe", "journal"].forEach(function (id) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("aria-pressed", String(curTool === id));
      b.innerHTML = "<span></span><small></small>";
      b.firstChild.textContent = t.tools[id][0]; b.lastChild.textContent = t.tools[id][1];
      b.addEventListener("click", function () { openTool(id, false); });
      box.appendChild(b);
    });
  }
  function openTool(id, fromChat) {
    stopBreath(); curTool = id; gStep = 0;
    showTab("tools"); renderToolList(); renderTool();
    if (fromChat && window.matchMedia("(max-width: 860px)").matches) $("side").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }
  function renderTool() {
    var body = $("tool-body"); body.textContent = "";
    if (curTool === "breathe") toolBreathe(body);
    else if (curTool === "ground") toolGround(body);
    else if (curTool === "reframe") toolReframe(body);
    else toolJournal(body);
  }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  function stopBreath() { breathRun++; }
  function toolBreathe(body) {
    var t = tx();
    var wrap = el("div", "orb-wrap"), orb = el("div", "orb"), label = el("div", "orb-label", t.phase.ready);
    label.setAttribute("aria-live", "polite");
    wrap.appendChild(orb); wrap.appendChild(label);
    var note = el("p", "sub", t.breatheNote), btn = el("button", "btn", t.start);
    btn.type = "button";
    body.appendChild(wrap); body.appendChild(note); body.appendChild(btn);
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    btn.addEventListener("click", async function () {
      if (btn.dataset.running === "1") { stopBreath(); btn.dataset.running = "0"; btn.textContent = t.start; label.textContent = t.phase.ready; orb.style.transition = "none"; orb.style.transform = "scale(0.75)"; return; }
      var token = ++breathRun; btn.dataset.running = "1"; btn.textContent = t.stop;
      var phases = [["in", 4, 1], ["hold", 4, 1], ["out", 6, 0.75]];
      for (var r = 1; r <= 4; r++) {
        for (var p = 0; p < phases.length; p++) {
          if (token !== breathRun) return;
          var ph = phases[p];
          orb.style.transition = reduce ? "none" : "transform " + ph[1] + "s ease-in-out";
          orb.style.transform = "scale(" + ph[2] + ")";
          for (var s = ph[1]; s >= 1; s--) {
            if (token !== breathRun) return;
            label.textContent = t.phase[ph[0]] + " " + s;
            await sleep(1000);
          }
        }
      }
      if (token !== breathRun) return;
      label.textContent = t.phase.done; btn.dataset.running = "0"; btn.textContent = t.again;
      orb.style.transition = "none"; orb.style.transform = "scale(0.75)";
    });
  }
  function toolGround(body) {
    var t = tx(), done = gStep >= t.ground.length;
    var card = el("div", "step-card");
    if (done) { card.appendChild(el("p", null, t.groundDone)); }
    else {
      card.appendChild(el("div", "big", t.ground[gStep][0]));
      card.appendChild(el("p", null, t.ground[gStep][1]));
    }
    var btn = el("button", "btn", done ? t.again : t.next); btn.type = "button";
    btn.addEventListener("click", function () { gStep = done ? 0 : gStep + 1; renderTool(); });
    body.appendChild(card); body.appendChild(btn);
  }
  function saveEntry(kind, text, statusEl) {
    text = text.trim(); if (!text) return;
    journal.unshift({ t: Date.now(), kind: kind, text: text });
    journal = journal.slice(0, 30); store.set("mm_journal", journal);
    statusEl.textContent = tx().saved;
  }
  function recentList(body, kind) {
    var t = tx(); body.appendChild(el("h3", null, t.recent));
    var list = el("div", "entries"), rows = journal.filter(function (j) { return j.kind === kind; }).slice(0, 3);
    if (!rows.length) list.appendChild(el("p", "sub", t.none));
    rows.forEach(function (j) {
      var e = el("div", "entry"), tm = el("time", null, new Date(j.t).toLocaleString(lang === "hi" ? "hi-IN" : "en-IN", { dateStyle: "medium", timeStyle: "short" }));
      e.appendChild(tm); e.appendChild(document.createTextNode(j.text)); list.appendChild(e);
    });
    body.appendChild(list);
  }
  function field(body, id, label, ph) {
    var wrap = el("label", "f", label); wrap.setAttribute("for", id);
    var ta = document.createElement("textarea"); ta.id = id; if (ph) ta.placeholder = ph;
    wrap.appendChild(ta); body.appendChild(wrap); return ta;
  }
  function toolReframe(body) {
    var t = tx();
    var a = field(body, "rf-a", t.reframeA), b = field(body, "rf-b", t.reframeB), c = field(body, "rf-c", t.reframeC, t.reframeHintC);
    var row = el("div", "row"), save = el("button", "btn", t.save), st = el("span", "sub");
    save.type = "button"; row.appendChild(save); row.appendChild(st); body.appendChild(row);
    save.addEventListener("click", function () {
      var txt = [a.value.trim(), b.value.trim(), c.value.trim()].filter(Boolean).join("\n");
      saveEntry("reframe", txt, st); if (txt) { a.value = b.value = c.value = ""; renderTool(); }
    });
    recentList(body, "reframe");
  }
  function toolJournal(body) {
    var t = tx(), q = el("p", null, t.journalPrompts[promptIdx % t.journalPrompts.length]);
    q.style.fontWeight = "600"; body.appendChild(q);
    var np = el("button", "btn ghost", t.newPrompt); np.type = "button";
    np.addEventListener("click", function () { promptIdx++; renderTool(); });
    var ta = field(body, "jr-text", t.journalLabel);
    var row = el("div", "row"), save = el("button", "btn", t.save), st = el("span", "sub");
    save.type = "button"; row.appendChild(save); row.appendChild(np); row.appendChild(st); body.appendChild(row);
    save.addEventListener("click", function () { saveEntry("journal", ta.value, st); if (ta.value.trim()) { ta.value = ""; renderTool(); } });
    recentList(body, "journal");
  }

  /* ---------- language + boot ---------- */
  function applyLang() {
    var t = tx();
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach(function (n) { n.textContent = t[n.getAttribute("data-i")]; });
    $("msg").placeholder = t.placeholder;
    $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    $("lang-hi").setAttribute("aria-pressed", String(lang === "hi"));
    $("clear").textContent = t.clear;
    renderMood(); renderToolList();
    if (curTool === "breathe" || curTool === "ground" || curTool === "reframe" || curTool === "journal") { stopBreath(); renderTool(); }
  }
  function setLang(l) {
    if (l === lang) return;
    lang = l; store.set("mm_lang", l); applyLang();
    if (log.children.length <= 1) { log.textContent = ""; greet(); }
    else setChips(moodChips());
  }
  $("lang-en").addEventListener("click", function () { setLang("en"); });
  $("lang-hi").addEventListener("click", function () { setLang("hi"); });

  function greet() { botSay(tx().greet, [], function () { setChips(moodChips()); }); }
  applyLang();
  greet();
})();
</script>
</body>
</html>
